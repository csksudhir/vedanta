{% extends "base.html" %}
{% block scripts %}
  {{ super() }}
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll(".md-typeset p").forEach(function (p) {
        if (p.textContent.includes(" · ") && p.textContent.includes(" — ")) {
          p.classList.add("w2w");
        }
      });
    });
  </script>
{% endblock %}
